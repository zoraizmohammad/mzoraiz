<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammad Zoraiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero-container">
        <!-- Main hero content -->
        <div class="hero-content">
            <!-- Top line: MOHAMMAD -->
            <div class="name-line">
                <span class="letter">M</span>
                <span class="eye-toggle" data-letter="O"></span>
                <span class="letter">H</span>
                <span class="letter">A</span>
                <span class="letter">M</span>
                <span class="letter">M</span>
                <span class="letter">A</span>
                <span class="letter">D</span>
            </div>
            
            <!-- Middle banner with scroll wheel -->
            <div class="banner">
                <div class="scroll-wheel-container">
                    <div class="scroll-wheel" id="scrollWheel">
                        <div class="scroll-item">Duke</div>
                        <span class="scroll-dot">•</span>
                        <div class="scroll-item">ECE</div>
                        <span class="scroll-dot">•</span>
                        <div class="scroll-item">Physics</div>
                        <span class="scroll-dot">•</span>
                        <div class="scroll-item">Computer Science</div>
                        <span class="scroll-dot">•</span>
                        <div class="scroll-item">Quantum Computing</div>
                        <span class="scroll-dot">•</span>
                        <div class="scroll-item">AI</div>
                        <span class="scroll-dot">•</span>
                        <div class="scroll-item">Education</div>
                        <span class="scroll-dot">•</span>
                    </div>
                </div>
            </div>
            
            <!-- Bottom line: ZORAIZ -->
            <div class="name-line">
                <span class="letter">Z</span>
                <span class="eye-toggle" data-letter="O"></span>
                <span class="letter">R</span>
                <span class="letter">A</span>
                <span class="letter">I</span>
                <span class="letter">Z</span>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
